openapi: 3.1.0
info:
  title: Evalio API
  description: 'AI hackathon jury: a Code Judge, a Market Judge and a Product Judge
    evaluate every submission against the hackathon''s weighted criteria; a Head Judge
    ranks them.'
  version: 2.0.0
paths:
  /api/create-hackathon:
    post:
      tags:
      - Hackathons
      summary: Create a hackathon with weighted judging criteria
      operationId: create_hackathon_api_create_hackathon_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HackathonCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/update-hackathon/{hackathon_id}:
    patch:
      tags:
      - Hackathons
      summary: Update a hackathon (e.g. open/close submissions)
      operationId: update_hackathon_api_update_hackathon__hackathon_id__patch
      parameters:
      - name: hackathon_id
        in: path
        required: true
        schema:
          type: integer
          title: Hackathon Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HackathonUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/get-hackathon/{hackathon_id}:
    get:
      tags:
      - Hackathons
      summary: Hackathon details with submission stats
      operationId: get_hackathon_api_get_hackathon__hackathon_id__get
      parameters:
      - name: hackathon_id
        in: path
        required: true
        schema:
          type: integer
          title: Hackathon Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/get-all-hackathons:
    get:
      tags:
      - Hackathons
      summary: List hackathons, newest first
      operationId: get_all_hackathons_api_get_all_hackathons_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/get-hackathon-leaderboard/{hackathon_id}:
    get:
      tags:
      - Hackathons
      - Scoring
      summary: Ranked projects of a hackathon
      operationId: get_hackathon_leaderboard_api_get_hackathon_leaderboard__hackathon_id__get
      parameters:
      - name: hackathon_id
        in: path
        required: true
        schema:
          type: integer
          title: Hackathon Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/create-project:
    post:
      tags:
      - Projects
      summary: Submit a project; the jury evaluates it in the background
      operationId: create_project_api_create_project_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/reevaluate/{project_id}:
    post:
      tags:
      - Projects
      summary: Run the whole jury again on a project
      operationId: reevaluate_api_reevaluate__project_id__post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/get-project/{project_id}:
    get:
      tags:
      - Projects
      summary: 'Full project report: verdict, judges, repo snapshot'
      operationId: get_project_api_get_project__project_id__get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/delete-project/{project_id}:
    delete:
      tags:
      - Projects
      summary: Delete a submission and its indexes
      operationId: delete_project_api_delete_project__project_id__delete
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/get-hackathon-projects/{hackathon_id}:
    get:
      tags:
      - Projects
      summary: Projects of a hackathon, newest first
      operationId: get_hackathon_projects_api_get_hackathon_projects__hackathon_id__get
      parameters:
      - name: hackathon_id
        in: path
        required: true
        schema:
          type: integer
          title: Hackathon Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/get-all:
    get:
      tags:
      - Projects
      summary: All projects, newest first
      operationId: get_all_projects_api_get_all_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/get-project-score/{project_id}:
    get:
      tags:
      - Projects
      - Scoring
      summary: Final score and explanation
      operationId: get_project_score_api_get_project_score__project_id__get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/review:
    post:
      tags:
      - Projects
      summary: Mark a project as reviewed by a human judge
      operationId: review_project_api_review_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/search:
    post:
      tags:
      - Projects
      - Search
      summary: Semantic search across submissions
      operationId: search_projects_api_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chat-agent:
    post:
      tags:
      - Chat Agent
      summary: Ask the jury about a project
      operationId: chat_api_chat_agent_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chat-agent/simple:
    post:
      tags:
      - Chat Agent
      summary: General judging assistant (no project)
      operationId: simple_chat_api_chat_agent_simple_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/code-agent/analyze:
    post:
      tags:
      - Code Agent
      summary: Ingest a repository and return its snapshot
      operationId: code_agent_analyze_api_code_agent_analyze_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepoIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/market-agent/analyze:
    post:
      tags:
      - Market Agent
      summary: Run the Market Judge on an idea
      operationId: market_agent_analyze_api_market_agent_analyze_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeaIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ChatIn:
      properties:
        question:
          type: string
          maxLength: 2000
          minLength: 1
          title: Question
        project_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Id
        chathistory:
          items:
            $ref: '#/components/schemas/ChatTurn'
          type: array
          title: Chathistory
      type: object
      required:
      - question
      title: ChatIn
    ChatTurn:
      properties:
        input:
          type: string
          title: Input
          default: ''
        output:
          type: string
          title: Output
          default: ''
      type: object
      title: ChatTurn
    CriterionIn:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
        weight:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Weight
          default: 1
        judge:
          anyOf:
          - type: string
          - type: 'null'
          title: Judge
        description:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Description
      type: object
      required:
      - name
      title: CriterionIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HackathonCreate:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 3
          title: Name
        description:
          type: string
          maxLength: 4000
          title: Description
          default: ''
        theme:
          type: string
          maxLength: 1000
          title: Theme
          default: ''
        technologies:
          type: string
          maxLength: 1000
          title: Technologies
          default: ''
        criteria:
          anyOf:
          - type: string
          - items:
              $ref: '#/components/schemas/CriterionIn'
            type: array
          - type: 'null'
          title: Criteria
        startsAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Startsat
        deadline:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deadline
        isAllowed:
          type: boolean
          title: Isallowed
          default: true
      type: object
      required:
      - name
      title: HackathonCreate
    HackathonUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 3
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Description
        theme:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Theme
        technologies:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Technologies
        criteria:
          anyOf:
          - type: string
          - items:
              $ref: '#/components/schemas/CriterionIn'
            type: array
          - type: 'null'
          title: Criteria
        startsAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Startsat
        deadline:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deadline
        isAllowed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Isallowed
      type: object
      title: HackathonUpdate
    IdeaIn:
      properties:
        idea:
          type: string
          maxLength: 4000
          minLength: 10
          title: Idea
        theme:
          type: string
          title: Theme
          default: ''
      type: object
      required:
      - idea
      title: IdeaIn
    ProjectCreate:
      properties:
        name:
          type: string
          maxLength: 80
          title: Name
          default: ''
        shortDescription:
          type: string
          maxLength: 160
          minLength: 5
          title: Shortdescription
        longDescription:
          type: string
          maxLength: 6000
          title: Longdescription
          default: ''
        githubLink:
          type: string
          maxLength: 300
          title: Githublink
        demoLink:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Demolink
        theme:
          type: string
          maxLength: 300
          title: Theme
          default: ''
        hackathonId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Hackathonid
        projectType:
          type: string
          title: Projecttype
          default: OTHER
      type: object
      required:
      - shortDescription
      - githubLink
      title: ProjectCreate
    RepoIn:
      properties:
        repo_url:
          type: string
          maxLength: 300
          minLength: 5
          title: Repo Url
      type: object
      required:
      - repo_url
      title: RepoIn
    ReviewIn:
      properties:
        project_id:
          type: string
          title: Project Id
        isReviewed:
          type: boolean
          title: Isreviewed
      type: object
      required:
      - project_id
      - isReviewed
      title: ReviewIn
    SearchIn:
      properties:
        query:
          type: string
          maxLength: 300
          minLength: 1
          title: Query
        hackathonId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Hackathonid
      type: object
      required:
      - query
      title: SearchIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
servers:
- url: http://localhost:8000
  description: Local
